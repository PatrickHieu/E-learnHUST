name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older in-flight runs when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Next.js app lives in a subdirectory of the repo. Every npm
        # command needs to run there.
        working-directory: ./e-learning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./e-learning/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test
